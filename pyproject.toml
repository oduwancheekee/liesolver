[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "liesolver"
version = "0.1.0"
requires-python = ">=3.12"
description = "Lie-symmetry-based PDE solver"
readme = "README.md"
license = {text = "License withheld for anonymous peer review"}
dependencies = [
    "numpy>=1.20",
    "scipy>=1.7", 
    "sympy>=1.9",
    "matplotlib>=3.4",
    "pyyaml>=5.4",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["liesolver*"]