pde: wave_1d
experiment_name: wave-gauss-g20_10-b5_4-mse6-seed0
seed: 0

data: 
  res: 100  
  # res: 600 # for step
  num_domain: 10_000
  range_dim:
    x: [0, 1]
    t: [0, 1]
  refresh: 0
  constraints:
    - expr: exp(-50 * (x - 0.5) ** 2)
      loc: [t, 0] 
      deriv_order: [0, 0]  # f value
      num_samples: 1500
      name: IC_u0

    - expr: 0
      loc: [t, 0]
      deriv_order: [0, 1]  # df/dt
      num_samples: 1000
      name: IC_ut0

    - expr: 0  # Dirichlet BC at x=0
      loc: [x, 0]
      num_samples: 1250
      name: BC_left
      
    - expr: 0  # Dirichlet BC at x=1
      loc: [x, 1]
      num_samples: 1250
      name: BC_right

bricks: 
# zero velocity IC bricks:
  - T4(0,100) T1(0,3.14) sin(x) cos(t)
  - T1(-1,2) T4(0,1000) exp(-(x+t)**2) + exp(-(x-t)**2)  # T1(range_dim[0] + [-c*dt, +c*dt]

# other optional bricks:
  # - T1(-1, 2) T4 1/(1+(x+t)**2) + 1/(1+(x-t)**2) # T1(range_dim[0] + [-c*dt, +c*dt])
  # - T1(-1, 2) T4 exp(-(x+t)**2) cos(x+t) + exp(-(x-t)**2) cos(x-t) 
  # - x cos(x) sin(t) + t sin(x) cos(t)

# non-zero velocity IC:
  # - T4(0,100) T1(0,3.14) sin(x+t)
  # - T4(0,100) T1(0,3.14) sin(x-t)
  # - T1(-1,2) T4(0,1000) exp(-(x+t)**2)
  # - T1(-1,2) T4(0,1000) exp(-(x-t)**2)

fit:
  mse_tol: 9e-7
  max_bricks: 40
  pool_size: 1000

  global_every: 20
  nfev_global: 4

  batch_size: 5 
  nfev_batch: 4

  

